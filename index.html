  "analyzer-add": () => {
  if (!S.analysis) {
    toast("Run AI analysis first");
    return;
  }

  const a = S.analysis;

  const required = [...new Set(
    (a.documentList || [])
      .map(x => String(x).trim())
      .filter(Boolean)
  )];

  // Keep the AI-extracted deadline as a candidate, not a verified date.
  const parseCandidateDate = value => {
    if (!value || /^(not found|unknown|not stated|none)$/i.test(String(value).trim())) {
      return null;
    }

    const text = String(value).trim();

    // Supports dates such as "15 November 2026".
    const match = text.match(
      /\b(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{4})\b/i
    );

    if (!match) return null;

    const months = {
      january: 0, february: 1, march: 2, april: 3,
      may: 4, june: 5, july: 6, august: 7,
      september: 8, october: 9, november: 10, december: 11
    };

    const day = Number(match[1]);
    const month = months[match[2].toLowerCase()];
    const year = Number(match[3]);

    const date = new Date(year, month, day, 17, 0, 0);

    if (
      date.getFullYear() !== year ||
      date.getMonth() !== month ||
      date.getDate() !== day
    ) {
      return null;
    }

    return date.toISOString();
  };

  const candidateDeadline = parseCandidateDate(a.deadline);

  const t = mk({
    id: "TN-" + String(S.seq++).padStart(3, "0"),
    title: a.title,
    sourceUrl: a.source || "",
    notice: a.notice || "",
    closing: null,
    origin: "ai-analysis",
    required,

    aiAnalysis: {
      mode: a.mode,
      model: a.model,
      emd: a.emd,
      deadline: a.deadline,
      candidateDeadline,
      eligibility: a.eligibility,
      docs: a.docs,
      documentList: required,
      risks: a.risks || [],
      missing: a.missing || [],
      officiallyVerified: !!a.officiallyVerified
    }
  });

  S.tenders.push(t);
  S.cur = t.id;
  S.tab = "overview";
  S.view = "detail";

  logIt(
    `Generated checklist for ${t.id} from AI analysis (${required.length} suggested document(s))`,
    "warn",
    {
      step: "Document Pack Agent",
      source: a.source || "Pasted tender notice",
      failure: "AI findings are preliminary; deadline, EMD and documents require verification."
    }
  );

  toast(
    required.length
      ? "Checklist created — verify AI findings"
      : "Tender saved; add required documents manually"
  );

  render();
},
    notif: () => { S.notifOpen = !S.notifOpen; renderBell(); },
    "enable-alerts": () => enableAlerts(),
    notif: () => { S.notifOpen = !S.notifOpen; renderBell(); },
    "enable-alerts": () => enableAlerts(),
    propose: el => {
      const t = S.tenders.find(x => x.id === el.dataset.id);
      if (propose(t, el.dataset.v)) { logIt(`Proposed ${el.dataset.v} action for ${t.id}. Waiting for approval.`, "info", { step: "Proposal", source: "Your request" }); toast("Sent to approval center"); }
      else toast("Already pending or approved");
      render();
    },
    decide: el => decide(el.dataset.id, el.dataset.ok === "1"),
    exp: el => {
      const k = el.dataset.k;
      if (k === "tenders") exportTendersCsv();
      else if (k === "checklist") exportChecklistCsv();
      else if (k === "activity") exportActivityCsv();
      else if (k === "pack") exportPackReport(S.tenders.find(x => x.id === el.dataset.id));
    },
    del: el => {
      const t = S.tenders.find(x => x.id === el.dataset.id);
      S.tenders = S.tenders.filter(x => x.id !== el.dataset.id);
      S.approvals = S.approvals.filter(a => a.tid !== el.dataset.id);
      logIt(`Deleted tender ${t.id}`, "warn", { step: "Edit", source: "Your action" });
      S.view = "tenders"; render(); toast("Tender deleted");
    }
  };

  const forms = {
    feedForm: f => {
      const items = parseFeed(new FormData(f).get("feed"));
      if (!items.length) { toast("Add at least one line with a title"); return; }
      S.feed = S.feed.concat(items);
      logIt(`Added ${items.length} listing(s) to recommended feed`, "info", { step: "Feed", source: "Your input" });
      toast(`${items.length} listing(s) added`); render();
    },
    profileForm: f => {
      const d = new FormData(f);
      const p = { company: String(d.get("company")).trim(), category: d.get("category"), region: String(d.get("region")).trim(), min: Number(d.get("min")), max: Number(d.get("max")), turnover: d.get("turnover") === "" ? null : Number(d.get("turnover")), experience: d.get("experience") === "" ? null : Number(d.get("experience")), msme: d.get("msme") || "unknown", email: String(d.get("email") || "").trim() };
      if (!p.company || !p.category || !p.region) { toast("Fill in all fields"); return; }
      if (p.min > p.max) { toast("Minimum budget cannot be above maximum"); return; }
      S.profile = p;
      logIt(`Profile saved: ${p.company}, ${p.category}, ${p.region}, ${money(p.min)} to ${money(p.max)}`, "ok", { step: "Setup", source: "Your input" });
      toast("Profile saved"); S.view = "dashboard"; render();
    },
    tenderForm: f => {
      const d = new FormData(f);
      const t = mk({
        id: "TN-" + String(S.seq++).padStart(3, "0"),
        title: String(d.get("title")).trim(), dept: String(d.get("dept") || "").trim(), category: d.get("category") || "", region: String(d.get("region") || "").trim(),
        value: d.get("value") === "" ? null : Number(d.get("value")),
        closing: d.get("closing") ? new Date(d.get("closing")).toISOString() : null,
        sourceUrl: String(d.get("sourceUrl") || "").trim(), notice: String(d.get("notice") || ""),
        required: lines(d.get("required")), files: lines(d.get("files")), sourceAvailable: lines(d.get("available"))
      });
      if (!t.title) { toast("Enter the tender title"); return; }
      S.tenders.push(t); S.cur = t.id; S.tab = "overview"; S.view = "detail";
      logIt(`Added ${t.id}: ${t.title} (manual entry)`, "info", { step: "Discovery", source: t.sourceUrl || "Entered manually" });
      toast("Tender added"); render();
    },
    corrForm: f => {
      const t = S.tenders.find(x => x.id === f.dataset.tid);
      const d = new FormData(f);
      if (!d.get("closing")) { toast("Enter the new closing date"); return; }
      const v = d.get("verified") === "on";
      t.corrigenda.push({ id: "C" + (t.corrigenda.length + 1), closing: new Date(d.get("closing")).toISOString(), source: String(d.get("source") || "").trim(), verified: v });
      logIt(`Corrigendum recorded for ${t.id} (${v ? "verified" : "unverified"})`, v ? "ok" : "warn", { step: "Corrigendum", source: String(d.get("source") || "Manual entry"), failure: v ? "" : "Not confirmed on official portal" });
      toast("Corrigendum saved"); render();
    },
    filesForm: f => {
      const t = S.tenders.find(x => x.id === f.dataset.tid);
      t.files = lines(new FormData(f).get("files"));
      logIt(`File list updated for ${t.id}`, "info", { step: "Documents", source: "Your input" });
      toast("File list saved"); render();
    },
    eligibilityForm: async f => {
  const d = new FormData(f);

  const profile = {
    company_name: String(d.get("company_name") || "").trim(),
    category: String(d.get("category") || "").trim(),
    region: String(d.get("region") || "").trim(),
    min_budget: Number(d.get("min_budget") || 0),
    max_budget: Number(d.get("max_budget") || 0),
    annual_turnover: d.get("annual_turnover") === ""
      ? null : Number(d.get("annual_turnover")),
    similar_work_years: d.get("similar_work_years") === ""
      ? null : Number(d.get("similar_work_years")),
    msme_registered: d.get("msme_registered") === "on"
  };

  if (!profile.company_name || !profile.category || !profile.region) {
    toast("Fill in company, category and region");
    return;
  }

  if (profile.min_budget > profile.max_budget) {
    toast("Minimum value cannot exceed maximum");
    return;
  }

  S.eligibilityProfile = profile;
  toast("Matching tenders...");

  try {
    const res = await fetch(
      "https://tender-pilot-ai-backend.vercel.app/api/eligibility-match",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ profile })
      }
    );

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || "Backend request failed");
    }

    S.eligibilityMatches = Array.isArray(data.matches)
      ? data.matches : [];

    logIt(
      "Eligibility matching completed: " +
      S.eligibilityMatches.length + " result(s)",
      "warn",
      {
        step: "MSME Eligibility Matching Agent",
        source: "TenderPilot backend",
        failure: "Preliminary screening only; verify original tender documents."
      }
    );

    toast("Matching complete — verify each tender");
    render();

  } catch (err) {
    console.error(err);
    toast("Matching failed: " + (err.message || "backend unavailable"));
  }
},
    analyzerForm: async f => {
      const d = new FormData(f);
      const body = {
        title: String(d.get("title") || "Untitled tender"),
        notice_text: String(d.get("notice") || ""),
        source_url: String(d.get("source") || "") || null
      };
      toast("Analyzing on backend...");
      try {
        const res = await fetch("https://tender-pilot-ai-backend.vercel.app/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const findings = Array.isArray(data.findings) ? data.findings : [];
        const get = field => {
          const item = findings.find(x => x.field === field);
          return item && item.value != null && String(item.value).trim() ? String(item.value).trim() : "Not found";
        };
        const docText = get("documents");
        const documentList = docText === "Not found" || /^(none|not stated|not found|unknown)$/i.test(docText)
          ? []
          : docText.split(/[;,\\n]+/).map(x => x.trim()).filter(x => x && !/^(documents?|corrigendum)$/i.test(x));
        const toList = value => {
          const items = Array.isArray(value) ? value.map(String) : typeof value === "string" ? value.split(/[;\\n]+/).map(x => x.trim()).filter(Boolean) : [];
          return items.filter(x => x && !/^(not found|none|unknown|not stated)$/i.test(x));
        };
        S.analysis = {
          title: data.title || body.title,
          source: data.source_url || body.source_url || "",
          notice: body.notice_text,
          mode: data.analysis_mode || "AI analysis",
          model: data.model || "Not reported",
          officiallyVerified: data.officially_verified === true,
          emd: get("possible_emd"),
          deadline: get("possible_deadline"),
          eligibility: ["turnover", "experience"].map(k => `${k}: ${get(k)}`).join("; "),
          docs: ["documents", "corrigendum"].map(k => `${k}: ${get(k)}`).join("; "),
          documentList,
          risks: toList(data.risks || data.risk_flags || get("risks")),
          missing: toList(data.missing_information || data.missing_info || get("missing_information"))
        };
        logIt(`Backend analysis done: ${data.title || body.title} (${data.analysis_mode || "mode not reported"})`, "warn",
          { step: "AI Analyzer", source: "TenderPilot backend /api/analyze", failure: data.officially_verified === true ? "" : "AI extraction only; official source not verified" });
        toast("AI analysis ready — review findings");
        render();
      } catch (err) {
        console.error(err);
        toast("AI backend not reachable. Check backend deployment and try again.");
      }
    },
    compareForm: f => {
      const d = new FormData(f), a = S.tenders.find(t=>t.id===d.get("a")), b = S.tenders.find(t=>t.id===d.get("b"));
      if (!a || !b || a.id === b.id) { toast("Choose two different tenders"); return; }
      const rows = [["Closing deadline", a.closing ? dt(a.closing) : "UNVERIFIED", b.closing ? dt(b.closing) : "UNVERIFIED"], ["Estimated value", money(a.value), money(b.value)], ["Category", a.category || "Not stated", b.category || "Not stated"], ["Region", a.region || "Not stated", b.region || "Not stated"], ["Eligibility", evaluate(a).overall, evaluate(b).overall], ["Document pack", evaluate(a).pack.status, evaluate(b).pack.status], ["Required docs", String(a.required.length), String(b.required.length)], ["EMD", evaluate(a).emd.status + (evaluate(a).emd.amount ? " · " + money(evaluate(a).emd.amount) : ""), evaluate(b).emd.status + (evaluate(b).emd.amount ? " · " + money(evaluate(b).emd.amount) : "")], ["Source evidence", a.sourceUrl ? `<a href="${esc(a.sourceUrl)}" target="_blank" rel="noopener noreferrer">Open source</a>` : "Not supplied", b.sourceUrl ? `<a href="${esc(b.sourceUrl)}" target="_blank" rel="noopener noreferrer">Open source</a>` : "Not supplied"]];
      S.compareHtml = `<section class="card" style="margin-top:16px"><div class="tw"><table><thead><tr><th>Field</th><th>${esc(a.title)}</th><th>${esc(b.title)}</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="strong">${r[0]}</td><td>${r[0]==="Source evidence"?r[1]:esc(r[1])}</td><td>${r[0]==="Source evidence"?r[2]:esc(r[2])}</td></tr>`).join("")}</tbody></table></div></section>`;
      logIt(`Compared tenders ${a.id} and ${b.id}`, "info", { step: "Comparison", source: "Saved tender records" });
      render();
    }
  };

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-a]");
    if (!el) return;
    const fn = actions[el.dataset.a];
    if (fn) { e.stopPropagation(); fn(el); }
  });
  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-a]")) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener("submit", e => {
    e.preventDefault();
    const h = forms[e.target.id];
    if (h) h(e.target);
  });
  document.addEventListener("input", e => {
    if (e.target.dataset.f === "q") { S.f.q = e.target.value; renderTbl(); }
  });
  document.addEventListener("change", e => {
    const k = e.target.dataset.f;
    if (k && k !== "q") { S.f[k] = e.target.value; renderTbl(); }
  });

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(v => { DL = v || null; render(); }).catch(() => {});
  }
  render();
  boot();
  setInterval(checkAlerts, 60000);
  checkAlerts();
</script>
</body>
</html>
